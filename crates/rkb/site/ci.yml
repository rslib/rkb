# Written by `rkb site ci`. Builds the site with rkb @VERSION@ on every push and deploys it to
# Cloudflare Pages. A lesson published for the first time needs `rkb site build` on your machine first.
name: Site

on:
  push:
    branches: [@BRANCH@]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push matters, so a newer run cancels an older one.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RKB_VERSION: "@VERSION@"
    steps:
      # Actions are pinned to commits, since a tag can be moved; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rkb
        run: |
          archive="rkb-linux-x86_64-v$RKB_VERSION.tar.gz"
          base="https://github.com/rslib/rkb/releases/download/v$RKB_VERSION"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sha256"
          sha256sum -c "$archive.sha256"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" rkb
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          RKB_HOME: ${{ github.workspace }}
          # The runner's user name is `runner`, a common word; the leak check still uses leak.usernames.
          USER: ""
@PASSWORDS@
        run: rkb site build --no-ask --out dist
      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if out=$(npx --yes wrangler@4.143.0 pages project create "$PROJECT" --production-branch=@BRANCH@ 2>&1); then
            echo "$out"
          elif echo "$out" | grep -qiE "already exists|8000002"; then
            echo "Pages project $PROJECT exists"
          else
            echo "$out"
            exit 1
          fi
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=@BRANCH@ --commit-dirty=true
