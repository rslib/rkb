# Run with prek (https://github.com/j178/prek); install the git hook once with `prek install`.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-test
        name: cargo test
        # Inside a git hook, git exports GIT_INDEX_FILE (and in some setups GIT_DIR and GIT_WORK_TREE)
        # for this repository; the tests' own git repositories must not inherit them.
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE -u GIT_PREFIX -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES cargo test --quiet
        language: system
        pass_filenames: false
        always_run: true
      - id: extension-check
        name: extension type check
        # Runs once `npm install` has run in extensions/rkb; the Rust tests drive the extension itself.
        entry: sh -c '[ ! -d extensions/rkb/node_modules ] || npm --prefix extensions/rkb run --silent check'
        language: system
        pass_filenames: false
        always_run: true
