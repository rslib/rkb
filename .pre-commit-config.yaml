# Run with prek (https://github.com/j178/prek); install the git hook once with `prek install`.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-test
        name: cargo test
        # Inside a git hook, git exports GIT_INDEX_FILE (and in some setups GIT_DIR and GIT_WORK_TREE)
        # for this repository; the tests' own git repositories must not inherit them.
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE -u GIT_PREFIX -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES cargo test --quiet
        language: system
        pass_filenames: false
        always_run: true
      - id: extension-check
        name: pi extension type check
        # Against the installed pi's own types, so a pi update that changes the API fails here. Runs once
        # `npm install` has run in extensions/pi; the Rust tests drive the extension itself.
        entry: sh -c '[ ! -d extensions/pi/node_modules ] || scripts/check-pi-extension.sh'
        language: system
        pass_filenames: false
        always_run: true
      - id: claude-mod-check
        name: claude mod check
        # Validates, type-checks and tests the mod against the installed `claude`; skipped without it.
        entry: sh -c 'command -v claude >/dev/null || exit 0; scripts/check-claude-mod.sh'
        language: system
        pass_filenames: false
        files: ^(extensions/claude/|scripts/check-claude-mod\.sh$|skills/rkb/SKILL\.md$)
