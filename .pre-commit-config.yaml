# Run with prek (https://github.com/j178/prek); install the git hook once with `prek install`.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-test
        name: cargo test
        entry: cargo test --quiet
        language: system
        pass_filenames: false
        always_run: true
      - id: extension-check
        name: extension type check
        # Runs once `npm install` has run in extensions/rkb; the Rust tests drive the extension itself.
        entry: sh -c '[ ! -d extensions/rkb/node_modules ] || npm --prefix extensions/rkb run --silent check'
        language: system
        pass_filenames: false
        always_run: true
