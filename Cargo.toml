[workspace]
resolver = "3"
members = ["crates/rkb", "crates/rkb-core", "crates/rkb-rerank"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
rkb-core = { path = "crates/rkb-core" }
rkb-rerank = { path = "crates/rkb-rerank" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
toml = "1"
toon-format = { version = "0.5", default-features = false }
ignore = "0.4"
globset = "0.4"
regex = "1"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
getrandom = "0.4"
sha2 = "0.11"
tempfile = "3"
